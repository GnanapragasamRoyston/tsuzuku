# Postgres + pgvector (toujours), API (profil « api », make api-up). Airflow (phase 6) et le
# frontend s'ajouteront ici.
services:
  db:
    # Image officielle pgvector : Postgres 16 avec l'extension déjà compilée.
    image: pgvector/pgvector:pg16
    container_name: tsuzuku-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    ports:
      # Lié à 127.0.0.1 : la base n'est pas exposée sur le réseau local.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création du volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Profil : `make up` ne démarre que la base ; l'API se lance avec `make api-up`.
    profiles: ["api"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tsuzuku-api
    environment:
      # Réseau interne de compose : la base s'appelle « db » et écoute sur 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # Artefacts produits par make train / make reco, en lecture seule.
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
