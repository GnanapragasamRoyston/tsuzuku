# Migrations du schéma app (comptes, listes). Lancement : make migrate (depuis la racine).
# L'URL de la base n'est PAS ici : env.py la lit dans DATABASE_URL (.env), jamais commitée.

[alembic]
script_location = %(here)s/migrations
# Noms de fichiers triables : 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
