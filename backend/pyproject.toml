[project]
name = "tsuzuku-backend"
version = "0.1.0"
description = "API FastAPI de Tsuzuku"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    # Client HTTP de Jikan (timeout, retries) ; aussi utilisé par TestClient.
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    # Code ML partagé avec le pipeline (fold-in, features de drop, chargement des artefacts).
    "tsuzuku-ml",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[tool.uv.sources]
tsuzuku-ml = { path = "../packages/tsuzuku-ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: a besoin de Postgres (make up) ; sauté en local s'il est absent, obligatoire en CI (REQUIRE_DB=1)",
]
addopts = "--strict-markers"
