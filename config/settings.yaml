# Configuration centrale du pipeline Tsuzuku.
# Toute valeur "magique" (seuil, taille d'échantillon, seed) vit ici, jamais en dur dans le code :
# ça rend les expériences reproductibles et les choix explicables.

project:
  seed: 42

paths:
  raw: data/raw
  parquet: data/parquet
  samples: data/samples
  marts: data/marts
  features: data/features
  models: models
  reports: reports

spark:
  # Ajuster selon la RAM de la machine (phase 1+).
  driver_memory: 6g
  # Partitions de shuffle : 200 par défaut, trop pour du local[*] ; ~2-3x le nombre de cœurs.
  shuffle_partitions: 48
  # Déversement disque de Spark : PAS /tmp (tmpfs en RAM sous WSL, saturé en phase 3).
  local_dir: data/.spark-tmp

data:
  # Slug vérifié via l'API Kaggle le 2026-11-16 (kaggle datasets list -s ...). Licence lue dans les
  # métadonnées du dataset au même moment : CC0-1.0.
  kaggle_dataset: hernan4444/anime-recommendation-database-2020
  license: CC0-1.0
  # Uniquement les CSV utiles : le dataset contient aussi un dossier html/ (17 562 zips) inutile ici.
  files:
    - watching_status.csv
    - anime.csv
    - anime_with_synopsis.csv
    - rating_complete.csv
    - animelist.csv
  # Échantillon de dev : part des utilisateurs gardés (toutes leurs lignes), tirée avec project.seed.
  sample_user_fraction: 0.02
  # Contenus adultes exclus partout (SPEC § 2.1).
  adult_filter:
    rating_prefixes: ["Rx"]
    genres: ["Hentai"]

critical_episode:
  # Point de non-retour : 1er épisode e où le risque de lâcher (pour qui a atteint e) tombe sous
  # ce ratio × le risque au 1er épisode. 0.25 = « risque divisé par 4 ». Choisi par Royston le
  # 2026-11-16 après mesure : le seuil absolu initial (complétion ≥ 0.9) tombait à l'épisode 1
  # pour 2 022 animes sur 3 339 (ADR 003).
  no_return_risk_ratio: 0.25
  # En dessous, l'épisode critique serait du bruit. Mesuré sur clean : 4 613 animes ont >= 50
  # drops, dont 3 798 avec >= 3 épisodes.
  min_drops: 50
  min_episodes: 3

retention:
  # Un genre/studio n'est publié que s'il a assez de volume pour que ses taux aient un sens.
  min_interactions: 1000  # lignes Completed + Dropped
  min_anime: 5

drop_model:
  # Features calculées par Spark sur les 71 M lignes Completed/Dropped, puis échantillon
  # d'utilisateurs (toutes leurs lignes) pour scikit-learn. 3 % ≈ 2,1 M lignes (validé le 2026-11-16).
  sample_user_fraction: 0.03
  # Split par utilisateur (GroupShuffleSplit) : le reste va au train.
  val_fraction: 0.15
  test_fraction: 0.15
  # Studios : les N plus fréquents du train gardent leur catégorie, les autres → « infrequent ».
  top_studios: 30
  # Grilles de recherche, sélection sur la PR-AUC de validation.
  logreg:
    C: [0.1, 1.0]
    max_iter: 1000
  hgb:
    learning_rate: [0.05, 0.1]
    max_leaf_nodes: [31, 63]
    max_iter: 300
  # Calibration : none | isotonic. Pas de pondération des classes (probabilités honnêtes) ;
  # isotonique seulement si la courbe de calibration du meilleur modèle dévie (décidé après mesure).
  calibration: none
  # Importance par permutation sur un sous-échantillon du test (coût ∝ lignes × répétitions).
  permutation_rows: 200000
  permutation_repeats: 5

key_figures:
  # Exemples mis en avant dans reports/key_figures (épisode critique, point de non-retour).
  # Titres EXACTS tels qu'ils figurent dans anime.csv (vérifiés dans catalog.media le 2026-11-16).
  # Guillemets obligatoires : « Fullmetal Alchemist: Brotherhood » sans guillemets est lu par
  # YAML comme un dictionnaire (à cause du « : »).
  showcase_titles:
    - "Death Note"
    - "Naruto"
    - "Steins;Gate"
    - "Shingeki no Kyojin"
    - "Sword Art Online"
    - "Fullmetal Alchemist: Brotherhood"

reco:
  # Seuils d'activité, appliqués en itérant jusqu'à stabilité. Mesuré sur clean le 2026-11-16
  # (reports/exploration_2026-11-16.json, reco_ratings_profile) : médiane 112 notes/utilisateur,
  # 230 notes/anime ; une passe à (20, 50) garde 56,27 M notes sur 56,73 M, 264 537 utilisateurs
  # et 10 861 animes.
  min_user_ratings: 20
  min_item_ratings: 50
  # Split PAR UTILISATEUR ; val/test ne sont jamais vus par l'ALS (évalués via le fold-in).
  val_fraction: 0.1
  test_fraction: 0.1
  # Part des notes de chaque utilisateur val/test masquée (à retrouver).
  mask_fraction: 0.2
  # Note masquée ≥ ce seuil = « aimé » (pertinent). Moyenne mesurée : 7,53 ; ≥ 8 = 54 % des notes.
  relevant_min_score: 8
  # Choix d'onboarding sans note (SPEC § 6.2) : 8, la note la plus fréquente (14,5 M notes).
  onboarding_default_score: 8
  # ALS implicite : note − 5 → une note ≤ 5 (10,7 % des notes) n'est pas une préférence positive.
  implicit_neutral_score: 5
  implicit_alpha: 1.0
  # Baseline RMSE : moyenne de l'anime tirée vers la moyenne globale (m notes fictives).
  baseline_shrinkage: 10
  # Grille sur une part des utilisateurs du train (temps de calcul), évaluée sur N utilisateurs
  # de validation ; les meilleurs de chaque variante sont réentraînés sur tout le train.
  grid_user_fraction: 0.25
  grid_eval_users: 5000
  # 1er run (rank 16-64, reg 0,05-0,2) : meilleur point au bord (rank 64, reg 0,05) pour les deux
  # variantes → grille élargie pour encadrer l'optimum (relevé par la revue de code).
  ranks: [16, 32, 64, 128]
  reg_params: [0.01, 0.03, 0.05, 0.1, 0.2]
  max_iter: 10
  num_blocks: 20
  k_values: [5, 10, 20]
  selection_k: 10
  # Régime d'usage réel : évaluation avec seulement n animes aimés donnés (onboarding).
  onboarding_n_liked: [3, 5, 10, 20]

api:
  # Sous ce nombre d'animes aimés connus du modèle, l'API sert la popularité au lieu de l'ALS.
  # Mesuré en phase 4 (reports/reco_metrics.json, onboarding_test, NDCG@10 test) : avec 3 titres
  # l'ALS implicite (0,175) fait moins bien que la popularité (0,193), avec 5 il passe devant
  # (0,214). Règle validée par Royston le 2026-11-20 (ADR 006).
  min_liked_for_als: 5
  default_k: 10
  max_k: 50
  # Taille maximale d'une liste envoyée à l'API (validation des entrées).
  max_list_items: 500
  search_limit_default: 20
  search_limit_max: 50
  jikan:
    # API publique sans clé (SPEC § 2.2). Limite documentée : 3 requêtes/s, 60/min.
    base_url: https://api.jikan.moe/v4
    # Appel fait PENDANT une requête /trending : budget court. Pire cas mesuré avec 10 s et
    # 3 retries quand Jikan ne répond pas : 47 s avant le 503 (2026-11-20). Avec 5 s et 2 retries :
    # 3 × 5 s + 1 s + 2 s d'attente, soit ~18 s au pire, puis failure_backoff_s sans réessayer.
    timeout_s: 5
    max_retries: 2
    # La saison en cours change peu dans l'heure : un appel par heure suffit.
    cache_seconds: 3600
    # Après un échec (retries épuisés), pas de nouvel essai avant ce délai : sans ça, chaque
    # requête relancerait toute la séquence de retries pendant une panne de Jikan.
    failure_backoff_s: 120
