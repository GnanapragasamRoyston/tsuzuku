[project]
name = "tsuzuku-pipeline"
version = "0.1.0"
description = "Pipeline Data/ML de Tsuzuku (Spark, Airflow, entraînement)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # (uv trie cette liste : chaque commentaire porte sur la ligne juste en dessous)
    # httpx : clients Jikan et AniList (ingestion, phase 6).
    "httpx>=0.27",
    "kaggle>=2.2.5",
    "matplotlib>=3.9",
    # pandas + pyarrow : lecture de l'échantillon de features (Parquet) pour scikit-learn.
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    # SPEC : PySpark 3.5 (Java 17). On bloque la mineure pour ne pas changer d'API par surprise.
    "pyspark>=3.5,<3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    # kaggle 2.2.5 importe `six` sans le déclarer dans ses dépendances : on l'ajoute nous-mêmes.
    "six>=1.17.0",
    # Code ML partagé avec l'API (fold-in, features de drop, artefacts) : ADR 006.
    "tsuzuku-ml",
]

[project.optional-dependencies]
# Embeddings des œuvres (phase 10, ADR 013) : `make embeddings` seulement. Ni l'image Airflow
# (installée avec --no-deps) ni l'API ne les installent ; les tests utilisent un encodeur factice.
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[tool.uv.sources]
# Paquet local du monorepo, installé en mode éditable : une modification est vue tout de suite.
tsuzuku-ml = { path = "../packages/tsuzuku-ml", editable = true }
# PyTorch en version CPU : la version par défaut embarque CUDA (plusieurs Go) pour rien ici.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsuzuku_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: a besoin de Postgres (make up) ; sauté en local s'il est absent, obligatoire en CI (REQUIRE_DB=1)",
]
# Un marqueur mal orthographié doit faire échouer, pas passer en silence.
addopts = "--strict-markers"
