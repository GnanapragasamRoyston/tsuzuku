[project]
name = "tsuzuku-pipeline"
version = "0.1.0"
description = "Pipeline Data/ML de Tsuzuku (Spark, Airflow, entraînement)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsuzuku_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
