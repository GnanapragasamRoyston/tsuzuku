[project]
name = "tsuzuku-ml"
version = "0.1.0"
description = "Code ML partagé par le pipeline et l'API de Tsuzuku (fold-in, features de drop, artefacts)"
requires-python = ">=3.11,<3.12"
# Volontairement léger : pas de Spark ici, pour que l'image de l'API reste petite (ADR 006).
dependencies = [
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    # Le modèle de drop est un pickle scikit-learn : la version mineure doit être la même à
    # l'entraînement et au service (contrôlé au chargement, tsuzuku_ml.artifacts).
    "scikit-learn>=1.9,<1.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsuzuku_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
